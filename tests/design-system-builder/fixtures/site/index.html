<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitio de prueba</title>
  <style>
    body {
      margin: 0;
      background: #f7f3ea;
      color: #1f2933;
      font-family: "Fixture Sans", Georgia, serif;
      font-size: 17px;
      line-height: 1.5;
    }
    header { padding: 24px; border-bottom: 1px solid #d9d2c3; }
    h1 { font-size: 32px; line-height: 40px; font-weight: 700; margin: 0; }
    .muted { color: #52606d; }
    .card {
      background: #ffffff;
      border: 1px solid #d9d2c3;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(31, 41, 51, 0.12);
      padding: 16px;
      margin: 24px;
    }
    .btn {
      background: #c2410c;
      color: #ffffff;
      border: 0;
      border-radius: 10px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
    }
    .hidden { display: none; color: #ff00ff; background: #00ff00; }
    @media (max-width: 600px) { h1 { font-size: 26px; line-height: 32px; } }
  </style>
</head>
<body>
  <header>
    <h1>Pedidos del día</h1>
    <p class="muted">Resumen de la jornada</p>
  </header>
  <main>
    <section class="card">
      <p>Hay tres pedidos pendientes de confirmar.</p>
      <button class="btn" type="button">Confirmar</button>
    </section>
    <p class="hidden">Este texto no se ve.</p>
  </main>
</body>
</html>
