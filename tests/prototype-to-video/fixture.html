<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture SHOWCASE v1</title>
  <style>
    :root { --bg: #f5f5f0; --ink: #1b1b1b; --accent: #2457d6; }
    :root[data-theme="dark"] { --bg: #15171c; --ink: #f1f1f1; --accent: #7aa2ff; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    .chrome { height: 56px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #8884; }
    body.capture .chrome { display: none; }
    #frame { position: absolute; inset: 0; overflow: hidden; }
    body:not(.capture) #frame { top: 56px; }
    #screen { position: absolute; inset: 0; padding: 32px; box-sizing: border-box; }
    #screen h1 { margin: 0 0 12px; font-size: 28px; }
    #screen .demo { font-size: 14px; opacity: .75; }
    .action { position: absolute; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 16px; }
    body.view-web .action { right: 64px; top: 180px; width: 220px; height: 48px; }
    body.view-phone .action { left: 16px; right: 16px; bottom: 24px; height: 48px; }
    body.view-phone #screen h1 { font-size: 22px; }
  </style>
</head>
<body>
  <div class="chrome">Showcase de prueba</div>
  <div id="frame"><section id="screen"></section></div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var capture = params.get('capture');
      var theme = params.get('theme') || 'light';
      document.documentElement.dataset.theme = theme;
      if (capture) document.body.classList.add('capture');

      var COLORS = { bandeja: '#e8f0ff', detalle: '#fff2e0', confirmacion: '#e6f7ea', ajustes: '#f3e8ff' };
      var SCREENS = {
        bandeja: { title: 'Bandeja de pedidos', action: { id: 'btn-primero', label: 'Abrir el primero' } },
        detalle: { title: 'Detalle del pedido', action: { id: 'btn-aprobar', label: 'Aprobar' } },
        confirmacion: { title: 'Pedido aprobado', action: { id: 'btn-listo', label: 'Listo' } },
        ajustes: { title: 'Ajustes', action: { id: 'switch-avisos', label: 'Avisos' } }
      };
      var FLOWS = [
        {
          id: 'aprobar-pedido', role: 'supervisor', title: 'Aprobar un pedido',
          lede: 'Del aviso a la aprobación en tres pasos.',
          steps: [
            { label: 'Abrir la bandeja', to: { screen: 'bandeja', role: 'supervisor' }, target: '#btn-primero', say: 'La bandeja muestra los pedidos pendientes.' },
            { label: 'Revisar el detalle', to: { screen: 'detalle', role: 'supervisor' }, target: '#btn-aprobar', say: 'El detalle reúne todo lo necesario para decidir.' },
            { label: 'Confirmar la aprobación', to: { screen: 'confirmacion', role: 'supervisor', sheet: 'resumen' }, target: '#btn-listo', say: 'Un toque y el pedido queda aprobado.' }
          ]
        },
        {
          id: 'cambiar-ajuste', role: 'operador', title: 'Cambiar un ajuste',
          lede: 'Activar los avisos sin salir de la pantalla.',
          steps: [
            { label: 'Abrir ajustes', to: { screen: 'ajustes', role: 'operador' }, target: '#switch-avisos', say: 'Los ajustes están a un toque.' },
            { label: 'Activar avisos', to: { screen: 'ajustes', role: 'operador', set: { avisos: true } }, target: '#switch-avisos' },
            { label: 'Ver el resultado', to: { screen: 'bandeja', role: 'operador' } }
          ]
        }
      ];

      var view = capture === 'phone' ? 'phone' : 'web';
      document.body.classList.add('view-' + view);
      var opened = [];

      function render(to, v) {
        document.body.classList.remove('view-web', 'view-phone');
        document.body.classList.add('view-' + v);
        var def = SCREENS[to.screen];
        if (!def) throw new Error('Unknown screen: ' + to.screen);
        var el = document.getElementById('screen');
        el.style.background = COLORS[to.screen];
        var state = to.set && to.set.avisos ? ' (activado)' : '';
        el.innerHTML = '<h1>' + def.title + state + '</h1>' +
          '<p class="demo">Datos de demostración · rol: ' + (to.role || 'sin rol') + (to.sheet ? ' · hoja: ' + to.sheet : '') + '</p>' +
          '<button class="action" id="' + def.action.id + '">' + def.action.label + '</button>';
      }

      function ready() {
        window.SHOWCASE = {
          version: '1',
          screens: function () { return Object.keys(SCREENS).map(function (id) { return { id: id, title: SCREENS[id].title }; }); },
          roles: function () { return [{ id: 'supervisor', label: 'Supervisor' }, { id: 'operador', label: 'Operador' }]; },
          flows: function () { return JSON.parse(JSON.stringify(FLOWS)); },
          open: function (to, opts) {
            var v = (opts && opts.view) || view;
            opened.push({ to: to, view: v });
            render(to, v);
            return document.fonts.ready.then(function () {
              return new Promise(function (resolve) {
                requestAnimationFrame(function () {
                  window.dispatchEvent(new CustomEvent('showcase:rendered', { detail: { to: to, view: v } }));
                  resolve();
                });
              });
            });
          },
          targetRect: function (selector, frame) {
            var node = document.querySelector(selector);
            if (!node) return null;
            var r = node.getBoundingClientRect();
            return { x: r.x, y: r.y, width: r.width, height: r.height };
          }
        };
        window.__opened = opened;
      }

      // Expose the API late on purpose: the capture script must wait for it.
      setTimeout(ready, 150);
    })();
  </script>
</body>
</html>
